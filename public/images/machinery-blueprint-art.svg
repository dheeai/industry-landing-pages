      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="rgba(155,181,255,0.075)" stroke-width="0.75"/>
    </pattern>
    <pattern id="bpMajor" width="100" height="100" patternUnits="userSpaceOnUse">
