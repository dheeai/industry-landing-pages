    </pattern>
    <pattern id="bpRailHatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)">
      <line x1="0" y1="0" x2="0" y2="8" stroke="rgba(155,181,255,0.25)" stroke-width="1"/>
