    <text x="48" y="68" font-family="ui-monospace, monospace" font-size="11" fill="#c4b5fd" letter-spacing="2">SCOPING THE FIRST QUESTION</text>
    <text x="48" y="132" font-family="Georgia, serif" font-size="40" fill="#f6f7f9">Begin with a concrete client situation.</text>
    <text x="48" y="176" font-family="system-ui, sans-serif" font-size="17" fill="#a8b3c7">Consultancies, integrators, and compliance partners turn abstract service scopes into clear entry points.</text>
