      <text x="24" y="84" font-family="Georgia, serif" font-size="24" fill="#f6f7f9">Advisory Fit</text>
      <text x="24" y="118" font-family="system-ui, sans-serif" font-size="14" fill="#a8b3c7">Frame assessment scope</text>
      <text x="24" y="140" font-family="system-ui, sans-serif" font-size="14" fill="#a8b3c7">before discovery calls</text>

      <rect x="330" width="300" height="176" rx="14" fill="rgba(56,189,248,0.09)" stroke="#38bdf8" stroke-opacity="0.35"/>
      <text x="354" y="42" font-family="ui-monospace, monospace" font-size="11" fill="#7dd3fc">INTEGRATION</text>
      <text x="354" y="84" font-family="Georgia, serif" font-size="24" fill="#f6f7f9">System Handoffs</text>
      <text x="354" y="118" font-family="system-ui, sans-serif" font-size="14" fill="#a8b3c7">Clarify interfaces, roles,</text>
      <text x="354" y="140" font-family="system-ui, sans-serif" font-size="14" fill="#a8b3c7">and delivery milestones</text>

      <rect x="660" width="300" height="176" rx="14" fill="rgba(255,90,47,0.09)" stroke="#ff8e53" stroke-opacity="0.35"/>
      <text x="684" y="42" font-family="ui-monospace, monospace" font-size="11" fill="#ff8e53">COMPLIANCE</text>
      <text x="684" y="84" font-family="Georgia, serif" font-size="24" fill="#f6f7f9">Readiness Path</text>
      <text x="684" y="118" font-family="system-ui, sans-serif" font-size="14" fill="#a8b3c7">Show what inputs help</text>
